AWSTemplateFormatVersion: '2010-09-09'
Description: "Child Stack 2 - Security Groups & EC2 Computing Instances (t3.small)"

Parameters:
  ParentVpcId:
    Type: String
  ParentPubSubnet1:
    Type: String
  ParentPvtSubnet1:
    Type: String
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  #IncomingUserData:
    #Type: StringBash

Resources:
  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow HTTP(80) and SSH(22) for Web Node"
      VpcId: !Ref ParentVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Beaver-PubSG

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Internal Communication for App Node"
      VpcId: !Ref ParentVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: Beaver-PvtSG

  PublicEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-minimal-kernel-6.1-x86_64}}"
      KeyName: !Ref KeyName
      # 2026.10.04 아래 블록을 추가하여 루트 볼륨 크기를 20GB로 확장하기 위해 지정
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          sudo dnf update -y
        
          # 1. Docker 설치 (Amazon Linux 2023 기준)
          sudo dnf install -y docker
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker ec2-user
        
          # 2. Docker Compose 플러그인 설치
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        
          # 3. Nginx 설치 및 실행 (필요시)
          sudo dnf install -y nginx
          sudo systemctl start nginx
          sudo systemctl enable nginx

          # 4. 프로젝트 디렉토리 생성 및 docker-compose.yml 자동 다운로드
          # (※ GitHub raw 링크, Object Storage 공개 URL, 또는 S3/Object Storage Presigned URL 등을 입력하세요)
          mkdir -p /home/ec2-user/beaver-monitoring
          cd /home/ec2-user/beaver-monitoring
          aws s3 cp s3://beaver-infra-bucket-2026/docker-compose.yml ./
          # 5. 권한 설정 및 도커 컴포즈 백그라운드 실행
          chown -R ec2-user:ec2-user /home/ec2-user/beaver-monitoring
          sudo -u ec2-user docker compose up -d

          echo "Auto-setup and Docker Compose deployment completed!"
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref ParentPubSubnet1
          GroupSet:
            - !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: Beaver-PubEC2

  PrivateEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-minimal-kernel-6.1-x86_64}}"
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          SubnetId: !Ref ParentPvtSubnet1
          GroupSet:
            - !Ref PrivateSecurityGroup
      Tags:
        - Key: Name
          Value: Beaver-PvtEC2