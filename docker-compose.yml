version: '3.8'

services:
  # 1. 메일 서버 핵심 엔진 (SMTP, IMAP 등)
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest      
    container_name: mailserver
    hostname: mail.example.com
    restart: unless-stopped
    ports:
      - "25:25"     # SMTP
      - "143:143"   # IMAP (비암호화)
      - "587:587"   # SMTP Submission
      - "993:993"   # IMAPS
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
    volumes:
      - ./mail-data:/var/mail
      - ./mail-state:/var/mail-state
      - ./mail-logs:/var/log/mail
      - ./config:/tmp/docker-mailserver
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      - mailnet

  # 2. 웹메일 UI 클라이언트 (Roundcube)
  webmail:
    image: roundcube/roundcubemail:latest
    container_name: webmail
    restart: unless-stopped
    ports:
      - "8080:80"   # 브라우저 접속용 포트
    environment:
      - IMAP_HOST=mailserver
      - IMAP_PORT=143
      - SMTP_HOST=mailserver
      - SMTP_PORT=587
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver:587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_DSN=sqlite:////var/roundcube/db/sqlite.db?mode=0646
    volumes:
      - ./config/roundcube/config.inc.php:/var/www/html/config/config.inc.php
      - ./config/roundcube/db:/var/roundcube/db
    depends_on:
      - mailserver
    networks:
      - mailnet
      
  # 3. 프로메테우스 (모니터링 데이터 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:          
      - mailnet 

  # 4. 그라파나 (대시보드 및 알림 UI)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:          
      - mailnet        
      
 # 5. 네트워크 정의
networks:
  mailnet:
    driver: bridge